<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argon</title>
<style>
	:root { --bg: #f7f5fb; --fg: #1d1b20; --muted: #6b6775; --accent: #7c4dff; }
	@media (prefers-color-scheme: dark) { :root { --bg: #121016; --fg: #e6e1e9; --muted: #948f9c; --accent: #a78bfa; } }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
	body { display: grid; place-items: center; }
	.box { display: flex; flex-direction: column; align-items: center; gap: 18px; }
	.tile { width: 96px; height: 96px; border-radius: 26px; display: grid; place-items: center; background: #17151d; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent); animation: pulse 1.6s ease-in-out infinite; }
	.tile b { font: 700 44px "Segoe UI", sans-serif; background: linear-gradient(135deg, #a78bfa, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
	.msg { color: var(--muted); }
	.err { color: #f87171; max-width: 520px; text-align: center; white-space: pre-wrap; }
	@keyframes pulse { 50% { transform: scale(0.94); border-radius: 48px; } }
</style>
</head>
<body>
	<div class="box">
		<div class="tile"><b>Ar</b></div>
		<div class="msg" id="msg">Starting Argon…</div>
	</div>
	<script>
		if (navigator.language.startsWith("it")) document.getElementById("msg").textContent = "Avvio di Argon…";
		window.showError = (text) => {
			const m = document.getElementById("msg");
			m.className = "err";
			m.textContent = text;
			document.querySelector(".tile").style.animation = "none";
		};
	</script>
</body>
</html>
